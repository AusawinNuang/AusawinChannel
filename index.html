<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPTVplus Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .video-js { width: 100% !important; height: 100% !important; border-radius: 0.75rem; overflow: hidden; }
        .video-js .vjs-big-play-button {
            background-color: rgba(59, 130, 246, 0.85) !important;
            border-color: #3b82f6 !important;
            border-radius: 50% !important;
            width: 2.5em !important; height: 2.5em !important; line-height: 2.5em !important;
            margin-top: -1.25em !important; margin-left: -1.25em !important;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-[#111827] border-b border-[#1f2937] px-6 py-4 flex items-center justify-between flex-shrink-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2.5 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-tv text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider text-white">iPTV<span class="text-blue-500">plus</span></h1>
                <p class="text-xs text-gray-400">Premium Web Player</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="relative hidden sm:block">
                <input type="text" id="searchInput" placeholder="ค้นหาช่องรายการ..." 
                       class="bg-[#1f2937] text-white pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 border border-[#374151]">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
            </div>
            <div class="bg-[#1f2937] px-4 py-2 rounded-xl text-xs text-gray-300 border border-[#374151]">
                <i class="fa-solid fa-list-ol mr-1 text-blue-500"></i> ทั้งหมด <span id="channelCount" class="font-bold text-white">0</span> ช่อง
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Sidebar -->
        <section class="w-full md:w-96 bg-[#111827] border-r border-[#1f2937] flex flex-col flex-shrink-0 h-1/2 md:h-full order-2 md:order-1">
            <div class="p-3 border-b border-[#1f2937] flex-shrink-0">
                <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1" id="categoryContainer"></div>
            </div>
            <div class="p-3 border-b border-[#1f2937] sm:hidden flex-shrink-0">
                <div class="relative">
                    <input type="text" id="mobileSearchInput" placeholder="ค้นหาช่องรายการ..." 
                           class="bg-[#1f2937] text-white pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full border border-[#374151]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-2 no-scrollbar" id="channelListContainer"></div>
        </section>

        <!-- Player Area -->
        <section class="flex-1 bg-[#090d16] p-4 md:p-6 flex flex-col h-1/2 md:h-full overflow-y-auto order-1 md:order-2">
            <div class="w-full aspect-video max-h-[70vh] bg-[#111827] rounded-2xl overflow-hidden relative shadow-2xl border border-[#1f2937] flex items-center justify-center">
                <div id="playerWrapper" class="w-full h-full hidden">
                    <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
                </div>
                <div id="standbyScreen" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-0">
                    <div class="w-20 h-20 bg-blue-600/10 rounded-full flex items-center justify-center mb-4 border border-blue-500/20">
                        <i class="fa-solid fa-circle-play text-4xl text-blue-500 animate-pulse"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2">ยินดีต้อนรับสู่ iPTVplus Player</h3>
                    <p class="text-sm text-gray-400 max-w-sm">เลือกช่องรายการจากเมนูเพื่อเริ่มรับชมสตรีมสด</p>
                </div>
            </div>

            <div class="mt-4 bg-[#111827] p-4 rounded-2xl border border-[#1f2937] flex items-center justify-between">
                <div class="flex items-center space-x-4 w-full">
                    <img id="currentLogo" src="https://placehold.co/150x150/111827/ffffff?text=TV" alt="Logo" 
                         class="w-14 h-14 object-contain bg-[#1f2937] p-2 rounded-xl border border-[#374151] flex-shrink-0" onerror="this.src='https://placehold.co/150x150/111827/ffffff?text=TV'">
                    <div class="min-w-0 flex-1">
                        <span id="currentCategory" class="px-2.5 py-0.5 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full text-[10px] font-semibold">สแตนด์บาย</span>
                        <h2 id="currentChannelName" class="text-base font-bold text-white mt-1 truncate">กรุณาเลือกช่องรายการ...</h2>
                        <p id="currentUrlText" class="text-xs text-gray-400 mt-0.5 truncate">ไม่ได้เชื่อมต่อสตรีม</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
