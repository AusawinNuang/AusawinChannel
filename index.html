<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPTVplus Player</title>
    <!-- Tailwind CSS for Beautiful Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Video.js and styles -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        /* Custom video-js styling to match premium player */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .video-js .vjs-big-play-button {
            background-color: rgba(59, 130, 246, 0.8) !important;
            border-color: #3b82f6 !important;
            border-radius: 50% !important;
            width: 2.5em !important;
            height: 2.5em !important;
            line-height: 2.5em !important;
            margin-top: -1.25em !important;
            margin-left: -1.25em !important;
        }
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header / Navigation Bar -->
    <header class="bg-[#111827] border-b border-[#1f2937] px-6 py-4 flex items-center justify-between flex-shrink-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2.5 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-tv text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider text-white">iPTV<span class="text-blue-500">plus</span></h1>
                <p class="text-xs text-gray-400">Premium Web Player v2.0</p>
            </div>
        </div>
        
        <!-- Search and Stats -->
        <div class="flex items-center space-x-4">
            <div class="relative hidden sm:block">
                <input type="text" id="searchInput" placeholder="ค้นหาช่องรายการ..." 
                       class="bg-[#1f2937] text-white pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 border border-[#374151] transition-all">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
            </div>
            <div class="bg-[#1f2937] px-4 py-2 rounded-xl text-xs text-gray-300 border border-[#374151]">
                <i class="fa-solid fa-list-ol mr-1 text-blue-500"></i> ทั้งหมด <span id="channelCount" class="font-bold">0</span> ช่อง
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Channel List (Left Side) -->
        <section class="w-full md:w-96 bg-[#111827] border-r border-[#1f2937] flex flex-col flex-shrink-0 h-full">
            
            <!-- Category Selector (Horizontal Scroll) -->
            <div class="p-4 border-b border-[#1f2937] flex-shrink-0">
                <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1" id="categoryContainer">
                    <button class="category-btn active px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white transition-all whitespace-nowrap" data-category="all">
                        ทั้งหมด
                    </button>
                    <!-- Categories will be rendered dynamically -->
                </div>
            </div>

            <!-- Mobile Search Bar (Visible only on mobile) -->
            <div class="p-3 border-b border-[#1f2937] md:hidden flex-shrink-0">
                <div class="relative">
                    <input type="text" id="mobileSearchInput" placeholder="ค้นหาช่องรายการ..." 
                           class="bg-[#1f2937] text-white pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full border border-[#374151]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
                </div>
            </div>

            <!-- Channels List Scrollable -->
            <div class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar" id="channelListContainer">
                <!-- Channels will be injected here -->
            </div>
        </section>

        <!-- Player Screen Area (Right Side) -->
        <section class="flex-1 bg-[#090d16] p-4 md:p-6 flex flex-col h-full overflow-y-auto">
            <!-- Player Container -->
            <div class="w-full aspect-video max-h-[70vh] bg-[#111827] rounded-2xl overflow-hidden relative shadow-2xl border border-[#1f2937] flex items-center justify-center">
                <!-- Video.js Player -->
                <div id="playerWrapper" class="w-full h-full hidden">
                    <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                        <p class="vjs-no-js">
                            หากต้องการรับชมวิดีโอนี้ กรุณาเปิดใช้งาน JavaScript หรืออัพเดตเว็บบราวเซอร์เป็นรุ่นที่รองรับ HTML5 video
                        </p>
                    </video>
                </div>

                <!-- Empty State / Standby screen -->
                <div id="standbyScreen" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-0">
                    <div class="w-20 h-20 bg-blue-600/10 rounded-full flex items-center justify-center mb-4 border border-blue-500/20">
                        <i class="fa-solid fa-circle-play text-4xl text-blue-500 animate-pulse"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2">ยินดีต้อนรับสู่ iPTVplus Player</h3>
                    <p class="text-sm text-gray-400 max-w-sm">กรุณาเลือกช่องรายการที่คุณต้องการรับชมจากเมนูด้านซ้ายเพื่อเริ่มสตรีมสัญญาณภาพ</p>
                </div>
            </div>

            <!-- Now Playing Information -->
            <div class="mt-6 bg-[#111827] p-5 rounded-2xl border border-[#1f2937] flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-4 w-full">
                    <img id="currentLogo" src="https://cdn.imgchest.com/files/93e778a0c482.webp" alt="Logo" 
                         class="w-16 h-16 object-contain bg-[#1f2937] p-2.5 rounded-xl border border-[#374151] flex-shrink-0" onerror="this.src='https://placehold.co/150x150/111827/ffffff?text=TV'">
                    <div>
                        <span id="currentCategory" class="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full text-[10px] font-semibold tracking-wider uppercase">
                            สแตนด์บาย
                        </span>
                        <h2 id="currentChannelName" class="text-lg font-bold text-white mt-1">กรุณาเลือกช่องรายการ...</h2>
                        <div class="flex items-center text-xs text-gray-400 mt-1 space-x-3">

                        </div>
                    </div>
                </div>
            </div>
        </section>

        // 2. Initialization and UI Rendering Logic
        let selectedCategory = 'all';
        let searchQuery = '';
        let activeChannelId = null;
        let player = null;

        // Elements
        const channelListContainer = document.getElementById('channelListContainer');
        const categoryContainer = document.getElementById('categoryContainer');
        const searchInput = document.getElementById('searchInput');
        const mobileSearchInput = document.getElementById('mobileSearchInput');
        const channelCountEl = document.getElementById('channelCount');
        
        // Setup Video player
        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('my-video', {
                fluid: true,
                liveui: true,
                playbackRates: [0.5, 1, 1.5, 2]
            });
            
            initApp();
        });

        function initApp() {
            // Set count
            channelCountEl.textContent = channels.length;
            
            // Build Categories
            const categories = ['all', ...new Set(channels.map(ch => ch.category))];
            categoryContainer.innerHTML = '';
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all whitespace-nowrap ${
                    selectedCategory === cat ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/10' : 'bg-[#1f2937] text-gray-400 hover:text-white'
                }`;
                btn.textContent = cat === 'all' ? 'ทั้งหมด' : cat;
                btn.addEventListener('click', () => selectCategory(cat));
                categoryContainer.appendChild(btn);
            });

            // Search Handlers
            const handleSearch = (e) => {
                searchQuery = e.target.value.toLowerCase();
                if (e.target === searchInput) mobileSearchInput.value = e.target.value;
                else searchInput.value = e.target.value;
                renderChannels();
            };
            searchInput.addEventListener('input', handleSearch);
            mobileSearchInput.addEventListener('input', handleSearch);

            renderChannels();
        }

        function selectCategory(category) {
            selectedCategory = category;
            
            // Update active state in category buttons
            const buttons = categoryContainer.querySelectorAll('.category-btn');
            const categories = ['all', ...new Set(channels.map(ch => ch.category))];
            buttons.forEach((btn, idx) => {
                const cat = categories[idx];
                if (selectedCategory === cat) {
                    btn.className = "category-btn px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white shadow-lg shadow-blue-500/10 transition-all whitespace-nowrap";
                } else {
                    btn.className = "category-btn px-4 py-2 rounded-xl text-xs font-semibold bg-[#1f2937] text-gray-400 hover:text-white transition-all whitespace-nowrap";
                }
            });

            renderChannels();
        }

        function renderChannels() {
            // Filter channels
            const filtered = channels.filter(ch => {
                const matchesCategory = selectedCategory === 'all' || ch.category === selectedCategory;
                const matchesSearch = ch.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            // Clear and Render list
            channelListContainer.innerHTML = '';
            
            if (filtered.length === 0) {
                channelListContainer.innerHTML = `
                    <div class="text-center py-8 text-gray-500 text-sm">
                        <i class="fa-solid fa-triangle-exclamation text-xl mb-2 text-gray-600"></i>
                        <p>ไม่พบช่องรายการที่ค้นหา</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(ch => {
                const item = document.createElement('div');
                const isActive = activeChannelId === ch.id;
                
                item.className = `flex items-center space-x-3.5 p-3.5 rounded-xl cursor-pointer transition-all border ${
                    isActive 
                    ? 'bg-blue-600/10 border-blue-500/40 text-white' 
                    : 'bg-[#1c2333]/40 border-transparent hover:bg-[#1c2333]/80 text-gray-300'
                }`;
                
                item.innerHTML = `
                    <img src="${ch.logo}" alt="${ch.name}" class="w-11 h-11 object-contain bg-[#111827] rounded-lg p-1.5 border ${isActive ? 'border-blue-500/30' : 'border-[#374151]'}" onerror="this.src='https://placehold.co/100x100/111827/ffffff?text=TV'">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-semibold truncate ${isActive ? 'text-blue-400' : 'text-gray-100'}">${ch.name}</h4>
                        <span class="text-[10px] text-gray-500 bg-black/20 px-2 py-0.5 rounded-md mt-1 inline-block">${ch.category}</span>
                    </div>
                    ${isActive ? '<span class="w-2.5 h-2.5 bg-blue-500 rounded-full shadow-lg shadow-blue-500/50"></span>' : ''}
                `;
                
                item.addEventListener('click', () => playChannel(ch));
                channelListContainer.appendChild(item);
            });
        }

        function playChannel(channel) {
            activeChannelId = channel.id;
            renderChannels(); // Refresh sidebar UI highlights

            // Show Player Elements
            document.getElementById('standbyScreen').classList.add('hidden');
            document.getElementById('playerWrapper').classList.remove('hidden');

            // Set Video Stream Source (M3U8 / MP4)
            let type = 'application/x-mpegURL'; // default HLS
            if (channel.url.endsWith('.mpd')) {
                type = 'application/dash+xml'; // MPEG-DASH
            } else if (channel.url.endsWith('.mp4')) {
                type = 'video/mp4';
            }

            // Load source and play
            player.src({
                src: channel.url,
                type: type
            });
            player.ready(() => {
                player.play().catch(err => {
                    console.log("Auto-play was prevented. Waiting for user interaction.");
                });
            });

            // Update bottom playing details info
            document.getElementById('currentLogo').src = channel.logo;
            document.getElementById('currentChannelName').textContent = channel.name;
            document.getElementById('currentCategory').textContent = channel.category;
            
            // Clean URL preview
            let cleanUrl = channel.url;
            if (cleanUrl.length > 50) {
                cleanUrl = cleanUrl.substring(0, 47) + '...';
            }
            document.getElementById('currentUrlText').textContent = cleanUrl;
        }
    </script>
