<!--
  DooDuaiKan (ดูด้วยกัน) - Optimized Multi-Source IPTV Player
  Updated Version with Parallel Fetch for Cloudflare KV Partitioned Playlists
-->
<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DooDuaiKan - ดูด้วยกัน</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Video.js & Hls.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --text: #f8fafc;
        --text-muted: #94a3b8;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      .tab-btn {
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
        border: 1px solid #334155;
        background: #1e293b;
        color: var(--text-muted);
        white-space: nowrap;
      }
      .tab-btn:hover {
        color: var(--text);
        border-color: #475569;
      }
      .tab-btn.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .channel-card {
        background: var(--card-bg);
        border: 1px solid #334155;
        border-radius: 0.75rem;
        transition: all 0.2s;
        cursor: pointer;
      }
      .channel-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
      }
      .ep-btn {
        background: #334155;
        color: var(--text);
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        transition: all 0.2s;
        text-align: center;
      }
      .ep-btn:hover {
        background: var(--accent);
      }
      .ep-btn.active {
        background: var(--accent);
        font-weight: bold;
      }
    </style>
  </head>
  <body class="custom-scrollbar">
    <div class="min-h-screen flex flex-col">
      <!-- Header -->
      <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-600 rounded-lg text-white">
              <i data-lucide="play" class="w-6 h-6 fill-current"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold tracking-tight">DooDuaiKan</h1>
              <p class="text-xs text-slate-400">ระบบสตรีมมิ่ง IPTV & VOD อัจฉริยะ</p>
            </div>
          </div>
          <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative flex-1 md:w-80">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <i data-lucide="search" class="w-4 h-4"></i>
              </span>
              <input
                type="text"
                id="search-input"
                placeholder="ค้นหาช่อง, ละคร, หนัง..."
                class="w-full pl-10 pr-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm"
              />
            </div>
          </div>
        </div>
      </header>

      <!-- Main Layout -->
      <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6 flex flex-col gap-6">
        <!-- Player Section -->
        <div id="player-container" class="hidden flex-col gap-4 bg-slate-900 border border-slate-800 p-4 rounded-xl">
          <div class="flex items-center justify-between">
            <h2 id="now-playing-title" class="text-lg font-semibold">กำลังเล่น</h2>
            <button onclick="closePlayer()" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
          <div class="aspect-video w-full bg-black rounded-lg overflow-hidden relative">
            <video id="main-video" class="video-js vjs-default-skin w-full h-full" controls preload="auto"></video>
          </div>
          <!-- Episode Bar for Series / Multi-Window -->
          <div id="episode-bar-container" class="hidden border-t border-slate-800 pt-4">
            <h3 class="text-sm font-medium text-slate-400 mb-2">เลือกตอน</h3>
            <div id="episode-list" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto custom-scrollbar"></div>
          </div>
        </div>

        <!-- Category Section -->
        <div class="flex flex-col gap-3">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <i data-lucide="layout-grid" class="w-5 h-5 text-blue-500"></i> หมวดหมู่รายการ
          </h2>
          <!-- แถบหมวดหมู่ใหม่ที่ดึงข้อมูลแยกชิ้นหลังบ้าน -->
          <div class="category-tabs flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar" id="category-tabs" role="tablist">
            <button type="button" class="tab-btn active" data-cat="ทั้งหมด">ทั้งหมด</button>
            <button type="button" class="tab-btn" data-cat="ฟรีทีวี">ฟรีทีวี</button>
            <button type="button" class="tab-btn" data-cat="ข่าวสาร">ข่าวสาร</button>
            <button type="button" class="tab-btn" data-cat="ทั่วไป">ทั่วไป</button>
            <button type="button" class="tab-btn" data-cat="กีฬา">กีฬา</button>
            <button type="button" class="tab-btn" data-cat="ละครซีรีย์">ละครซีรีย์</button>
            <button type="button" class="tab-btn" data-cat="Movies">Movies</button>
            <button type="button" class="tab-btn" data-cat="ซีรี่ย์แนวตั้ง">ซีรี่ย์แนวตั้ง</button>
            <button type="button" class="tab-btn" data-cat="ภาพยนตร์">ภาพยนตร์</button>
            <button type="button" class="tab-btn" data-cat="สารคดี">สารคดี</button>
            <button type="button" class="tab-btn" data-cat="บันเทิง">บันเทิง</button>
            <button type="button" class="tab-btn" data-cat="เพลง">เพลง</button>
          </div>
        </div>

        <!-- Channel Grid -->
        <div class="flex flex-col gap-3">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <i data-lucide="tv" class="w-5 h-5 text-blue-500"></i> รายการทั้งหมด
          </h2>
          <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- ไดนามิกไอเทมจะถูกสร้างโดย JS -->
          </div>
          <div id="no-results" class="hidden text-center py-12 text-slate-400">
            <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 stroke-1 text-slate-500"></i>
            <p>ไม่พบรายการที่ตรงกับการค้นหา</p>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="mt-auto border-t border-slate-800 bg-slate-900/30 py-6 px-4 text-center text-sm text-slate-500">
        <p>&copy; 2026 DooDuaiKan. All rights reserved. มอบความบันเทิงอย่างมีคุณภาพ</p>
      </footer>
    </div>

    <!-- Script Zone -->
    <script>
      // 1. กำหนดสิทธิ์และความลับในการแลกเปลี่ยนข้อมูล
      const APP_SECRET_KEY = 'DooDuaiKan_Secret_2026_!@#';
      
      // ลิงก์ API ย่อยแยกคีย์ใน Cloudflare KV
      const REMOTE_API_URLS = [
        'https://dooduaikan-api.kruttha.workers.dev/channels.json',
        'https://dooduaikan-api.kruttha.workers.dev/series.json',
        'https://dooduaikan-api.kruttha.workers.dev/movies.json',
        'https://dooduaikan-api.kruttha.workers.dev/vertical_series.json'
      ];

      const channels = [];
      let activeCategory = 'ทั้งหมด';
      let searchQuery = '';
      let videoPlayer = null;

      // ปรับปรุงฟังก์ชันตรวจสอบซีรีย์ / VOD แบบหลายตอนให้รอบด้าน
      function isSeriesMultiWindowChannel(channel) {
        if (!channel) return false;
        const cat = String(channel.category || '').trim();
        const isSeriesCat = cat.includes('ซีรีส์') || 
                            cat.includes('ซีรี่') || 
                            cat.includes('ละคร') || 
                            cat.includes('Movies') || 
                            cat.includes('ภาพยนตร์') || 
                            cat.includes('แนวตั้ง') || 
                            cat.toLowerCase().includes('series') || 
                            Boolean((channel.stations && channel.stations.length > 0) || (channel.groups && channel.groups.length > 0));
        if (!isSeriesCat) return false;
        return true;
      }

      // ดึงข้อมูลพร้อมกันทั้ง 4 เส้นทางจากเซิร์ฟเวอร์แบบคู่ขนาน (Parallel Fetch)
      async function loadLatestChannels() {
        const fetchHeaders = {
          'X-App-Secret': typeof APP_SECRET_KEY !== 'undefined' ? APP_SECRET_KEY : 'DooDuaiKan_Secret_2026_!@#'
        };

        try {
          const requests = REMOTE_API_URLS.map(async (url) => {
            try {
              const res = await fetch(url + '?t=' + Date.now(), {
                method: 'GET',
                cache: 'no-store',
                headers: fetchHeaders
              });
              return res.ok ? await res.json() : [];
            } catch (e) {
              console.warn(`ล้มเหลวในการดึง API: ${url}`, e);
              return [];
            }
          });

          const results = await Promise.all(requests);
          const combinedItems = [];

          results.forEach(remoteData => {
            if (remoteData) {
              const list = Array.isArray(remoteData)
                ? remoteData
                : (Array.isArray(remoteData.groups) ? remoteData.groups : (Array.isArray(remoteData.stations) ? remoteData.stations : []));
              list.forEach(item => {
                if (item && typeof item === 'object') {
                  combinedItems.push(item);
                }
              });
            }
          });

          if (combinedItems.length > 0) {
            channels.length = 0;
            combinedItems.forEach(item => channels.push(item));
            renderChannels();
          }
        } catch (err) {
          console.error("เกิดข้อผิดพลาดในการรวบรวมเพลย์ลิสต์:", err);
          renderChannels();
        }
      }

      // แสดงช่องรายการลงในตารางหลัก
      function renderChannels() {
        const grid = document.getElementById('channels-grid');
        const noResults = document.getElementById('no-results');
        grid.innerHTML = '';

        const filtered = channels.filter(ch => {
          const matchesCat = activeCategory === 'ทั้งหมด' || ch.category === activeCategory;
          const matchesSearch = ch.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                (ch.category && ch.category.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
          noResults.classList.remove('hidden');
        } else {
          noResults.classList.add('hidden');
          filtered.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card p-3 flex flex-col gap-2 relative';
            card.onclick = () => playChannel(ch);

            // คำนวณอัตราส่วนภาพปกตามความเหมาะสม (แนวตั้ง/แนวนอน)
            const isVertical = String(ch.category || '').includes('แนวตั้ง');
            const imgClass = isVertical ? 'aspect-[2/3] object-cover' : 'aspect-[16/9] object-contain';

            card.innerHTML = `
              <div class="w-full bg-slate-800 rounded-md overflow-hidden flex items-center justify-center">
                <img src="${ch.logo || 'https://via.placeholder.com/300x180.png?text=No+Image'}" alt="${ch.name}" class="w-full h-full ${imgClass} hover:scale-105 transition duration-300" loading="lazy" />
              </div>
              <div class="flex flex-col gap-1">
                <span class="text-xs text-blue-500 font-semibold uppercase tracking-wider">${ch.category || 'ทั่วไป'}</span>
                <span class="text-sm font-medium line-clamp-1">${ch.name}</span>
              </div>
            `;
            grid.appendChild(card);
          });
        }
      }

      // เล่นช่องและดึงข้อมูล Multi-Window VOD
      function playChannel(ch) {
        const container = document.getElementById('player-container');
        const title = document.getElementById('now-playing-title');
        const episodeContainer = document.getElementById('episode-bar-container');
        const episodeList = document.getElementById('episode-list');

        container.classList.remove('hidden');
        title.innerText = ch.name;

        // เคลื่อนหน้าจอขึ้นไปที่เครื่องเล่นเพื่อประสบการณ์ผู้ใช้งานที่ดี
        container.scrollIntoView({ behavior: 'smooth' });

        if (isSeriesMultiWindowChannel(ch)) {
          episodeContainer.classList.remove('hidden');
          episodeList.innerHTML = '';

          const eps = ch.stations || ch.groups || [];
          if (eps.length > 0) {
            eps.forEach((ep, index) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
              btn.innerText = ep.name || `ตอนที่ ${index + 1}`;
              btn.onclick = (e) => {
                e.stopPropagation();
                // เปลี่ยนตอนเล่น
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                initVideoPlayer(ep.url);
              };
              episodeList.appendChild(btn);
            });
            // เล่นตอนแรกเป็นค่าเริ่มต้น
            initVideoPlayer(eps[0].url);
          } else if (ch.url) {
            episodeContainer.classList.add('hidden');
            initVideoPlayer(ch.url);
          }
        } else {
          episodeContainer.classList.add('hidden');
          initVideoPlayer(ch.url);
        }
      }

      // สร้างเครื่องเล่น HLS
      function initVideoPlayer(url) {
        const videoElement = document.getElementById('main-video');
        
        if (videoPlayer) {
          videoPlayer.dispose();
          videoPlayer = null;
        }

        // นำ Element กลับมาใหม่เพื่อเคลียร์ State
        const parent = videoElement.parentNode;
        parent.innerHTML = `<video id="main-video" class="video-js vjs-default-skin w-full h-full" controls preload="auto"></video>`;

        videoPlayer = videojs('main-video', {
          fluid: true,
          playbackRates: [0.5, 1, 1.25, 1.5, 2]
        });

        videoPlayer.src({
          src: url,
          type: url.includes('.mp4') ? 'video/mp4' : 'application/x-mpegURL'
        });

        videoPlayer.play().catch(e => console.log('Auto-play blocked or error: ', e));
      }

      // ปิดเครื่องเล่น
      function closePlayer() {
        if (videoPlayer) {
          videoPlayer.pause();
          videoPlayer.dispose();
          videoPlayer = null;
        }
        document.getElementById('player-container').classList.add('hidden');
        document.getElementById('episode-bar-container').classList.add('hidden');
      }

      // เริ่มการทำงาน Event Listeners
      document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        loadLatestChannels();

        // คัดกรองผ่านปุ่มแท็บ
        const tabs = document.getElementById('category-tabs');
        tabs.addEventListener('click', (e) => {
          const btn = e.target.closest('.tab-btn');
          if (!btn) return;

          Array.from(tabs.querySelectorAll('.tab-btn')).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategory = btn.getAttribute('data-cat');
          renderChannels();
        });

        // ค้นหาผ่านกล่องค้นหา
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim();
          renderChannels();
        });
      });
    </script>
  </body>
</html>
