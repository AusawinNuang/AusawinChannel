    <title>iPTVplus Web Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
        }
        header {
            background-color: #1e1e1e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff4500;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: #ff4500;
        }
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }
        .sidebar {
            width: 300px;
            background-color: #1a1a1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .search-box {
            padding: 15px;
            border-bottom: 1px solid #333;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .category-filter {
            padding: 10px 15px;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .category-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }
        .category-btn.active {
            background-color: #ff4500;
        }
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .channel-item:hover {
            background-color: #2a2a2a;
        }
        .channel-item.active {
            background-color: #ff4500;
        }
        .channel-logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            background-color: #333;
        }
        .channel-info {
            flex: 1;
        }
        .channel-name {
            font-weight: bold;
            font-size: 16px;
        }
        .channel-category {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
        }
        .video-container {
            flex: 1;
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .video-details {
            padding: 20px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
        }
        .video-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
    <!-- Include Hls.js library for m3u8 playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

    <header>

    </header>

    <div class="container">
        <!-- Sidebar containing filters and channels -->

            <div class="search-box">
                <input type="text" id="search-input" placeholder="ค้นหาช่องรายการ...">
            </div>
            <div class="category-filter" id="category-container">
                <button class="category-btn active" onclick="filterCategory('ทั้งหมด')">ทั้งหมด</button>
                <button class="category-btn" onclick="filterCategory('กีฬา')">กีฬา</button>
                <button class="category-btn" onclick="filterCategory('ทั่วไป')">ทั่วไป</button>
            </div>
            <div class="channel-list" id="channel-container">
                <!-- Channel items will be injected here by JS -->
            </div>
        </div>

        <!-- Main content video player area -->
        <div class="main-content">
            <div class="video-container">
                <video id="video-player" controls autoplay></video>
            </div>

        </div>

        let currentCategory = 'ทั้งหมด';
        let searchQuery = '';

        // UI Initialization functions
        function renderChannels() {
            const container = document.getElementById('channel-container');
            container.innerHTML = '';

            const filtered = channels.filter(ch => {
                const matchesCategory = currentCategory === 'ทั้งหมด' || ch.category === currentCategory;
                const matchesSearch = ch.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            filtered.forEach(ch => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.onclick = () => selectChannel(ch);

                const logoSrc = ch.logo || 'https://raw.githubusercontent.com/AusawinNuang/Pic/refs/heads/main/aisplay.png';
                item.innerHTML = `
                    <img src="${logoSrc}" class="channel-logo" alt="${ch.name}" onerror="this.src='https://raw.githubusercontent.com/AusawinNuang/Pic/refs/heads/main/aisplay.png'">
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-category">${ch.category}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                if (btn.textContent === category) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderChannels();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderChannels();
        });

        // Player selection logic using Hls.js library
        function selectChannel(channel) {
            document.getElementById('current-channel-header').textContent = `กำลังรับชม: ${channel.name}`;
            document.getElementById('player-channel-name').textContent = channel.name;
            document.getElementById('player-channel-desc').textContent = `หมวดหมู่: ${channel.category} | สตรีมลิงก์: ${channel.url}`;

            // Reset active state in DOM list
            const items = document.querySelectorAll('.channel-item');
            items.forEach(item => {
                if (item.querySelector('.channel-name').textContent === channel.name) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            const video = document.getElementById('video-player');
            if (Hls.isSupported()) {
                if (window.hls) {
                    window.hls.destroy();
                }
                const hls = new Hls({
                    xhrSetup: function (xhr, url) {
                        // User-Agent and Referrer are handled automatically inside Web browsers.
                        // For fully customized headers in desktop/app players, configure external agents.
                    }
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                window.hls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
            }
        }

        // Initialize lists on load
        window.onload = () => {
            renderChannels();
        };
    </script>
