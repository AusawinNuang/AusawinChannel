<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ดูด้วยกัน(เงียบๆ)</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --brand: #3b82f6;
      --brand-hover: #2563eb;
      --brand-ink: #ffffff;
      --accent: #06b6d4;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: var(--space-3) var(--space-4);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-ink);
    }

    .main-container {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: var(--space-4);
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      flex: 1;
    }

    @media (min-width: 900px) {
      .main-container {
        grid-template-columns: 1.5fr 1fr;
        padding: var(--space-6);
        gap: var(--space-6);
        align-items: start;
      }
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Player Section */
    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      display: none;
      background-color: #000;
    }

    video.active {
      display: block;
    }

    .player-placeholder {
      text-align: center;
      padding: var(--space-6);
      color: var(--muted);
      max-width: 360px;
    }

    .player-placeholder svg {
      width: 48px;
      height: 48px;
      margin-bottom: var(--space-3);
      stroke: var(--muted);
      opacity: 0.7;
    }

    .player-placeholder h2 {
      font-size: 1.05rem;
      color: var(--ink);
      margin-bottom: var(--space-1);
    }

    .player-placeholder p {
      font-size: 0.875rem;
    }

    .now-playing-bar {
      padding: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      border-top: 1px solid var(--border);
    }

    .now-playing-info {
      min-width: 0;
    }

    .now-playing-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
    }

    .now-playing-title {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-msg {
      font-size: 0.8rem;
      color: var(--danger);
      margin-top: var(--space-1);
      display: none;
    }

    .status-msg.visible {
      display: block;
    }

    /* Controls & Form */
    .section-header {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .form-body {
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .field label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    input[type="text"],
    input[type="url"],
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
      transition: border-color 0.15s ease;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--brand);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }

    .btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary {
      background-color: var(--brand);
      color: var(--brand-ink);
    }

    .btn-primary:hover {
      background-color: var(--brand-hover);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--ink);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--surface-hover);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Channel List */
    .filter-bar {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .category-tabs {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--ink);
      border-color: var(--muted);
    }

    .tab-btn.active {
      background: var(--brand);
      color: var(--brand-ink);
      border-color: var(--brand);
    }

    .channel-list {
      max-height: 440px;
      overflow-y: auto;
      divide-y: 1px solid var(--border);
    }

    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .channel-item:last-child {
      border-bottom: none;
    }

    .channel-item:hover {
      background-color: var(--surface-hover);
    }

    .channel-item.active {
      background-color: rgba(59, 130, 246, 0.15);
      border-left: 3px solid var(--brand);
    }

    .channel-meta {
      min-width: 0;
      flex: 1;
    }

    .channel-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: contain;
      background-color: var(--bg);
      border: 1px solid var(--border);
      padding: 2px;
      flex-shrink: 0;
    }

    .channel-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-cat {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.12);
    }

    .empty-state {
      padding: var(--space-6) var(--space-4);
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
  </style>

       ];

      let activeChannelId = null;
      let selectedCategory = 'ทั้งหมด';
      let searchQuery = '';
      let hlsInstance = null;

      const videoEl = document.getElementById('tv-video');
      const placeholderEl = document.getElementById('player-placeholder');
      const currentTitleEl = document.getElementById('current-title');
      const currentCatEl = document.getElementById('current-cat');
      const errorMsgEl = document.getElementById('error-msg');

      const searchInput = document.getElementById('search-input');
      const categoryTabs = document.getElementById('category-tabs');
      const channelListEl = document.getElementById('channel-list');

      function showPlayerError(msg) {
        if (msg) {
          errorMsgEl.textContent = msg;
          errorMsgEl.classList.add('visible');
        } else {
          errorMsgEl.textContent = '';
          errorMsgEl.classList.remove('visible');
        }
      }

      function playChannel(channel) {
        if (!channel) return;
        activeChannelId = channel.id;
        showPlayerError('');
        currentTitleEl.textContent = channel.name;
        currentCatEl.textContent = 'หมวดหมู่: ' + channel.category;

        placeholderEl.style.display = 'none';
        videoEl.classList.add('active');

        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }

        const url = channel.url.trim();
        const isHls = url.toLowerCase().includes('.m3u8');

        if (isHls && window.Hls && window.Hls.isSupported()) {
          hlsInstance = new window.Hls();
          hlsInstance.loadSource(url);
          hlsInstance.attachMedia(videoEl);
          hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, function () {
            videoEl.play().catch(function () {});
          });
          hlsInstance.on(window.Hls.Events.ERROR, function (event, data) {
            if (data && data.fatal) {
              showPlayerError('ไม่สามารถโหลดสตรีมนี้ได้ กรุณาตรวจสอบลิงก์หรือการรองรับ CORS ของสตรีม');
            }
          });
        } else {
          videoEl.src = url;
          videoEl.play().catch(function () {});
        }

        renderChannels();
      }

      videoEl.addEventListener('error', function () {
        if (activeChannelId) {
          showPlayerError('ไม่สามารถเล่นไฟล์สตรีมจากลิงก์นี้ได้');
        }
      });

      function renderChannels() {
        const filtered = channels.filter(function (ch) {
          const matchCat = selectedCategory === 'ทั้งหมด' || ch.category === selectedCategory;
          const matchSearch = ch.name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });

        channelListEl.innerHTML = '';

        if (filtered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = channels.length === 0
            ? 'ยังไม่มีช่องรายการในระบบ'
            : 'ไม่พบช่องรายการที่ตรงกับการค้นหา';
          channelListEl.appendChild(empty);
          return;
        }

        filtered.forEach(function (ch) {
          const item = document.createElement('div');
          item.className = 'channel-item' + (ch.id === activeChannelId ? ' active' : '');
          item.setAttribute('role', 'button');
          item.setAttribute('tabindex', '0');

          if (ch.logo) {
            const logoImg = document.createElement('img');
            logoImg.className = 'channel-logo';
            logoImg.src = ch.logo;
            logoImg.alt = ch.name;
            logoImg.loading = 'lazy';
            logoImg.addEventListener('error', function () {
              logoImg.style.display = 'none';
            });
            item.appendChild(logoImg);
          }

          const meta = document.createElement('div');
          meta.className = 'channel-meta';

          const name = document.createElement('div');
          name.className = 'channel-name';
          name.textContent = ch.name;

          const cat = document.createElement('div');
          cat.className = 'channel-cat';
          cat.textContent = ch.category;

          meta.appendChild(name);
          meta.appendChild(cat);

          item.appendChild(meta);

          item.addEventListener('click', function () {
            playChannel(ch);
          });

          item.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              playChannel(ch);
            }
          });

          channelListEl.appendChild(item);
        });
      }

      searchInput.addEventListener('input', function (e) {
        searchQuery = e.target.value;
        renderChannels();
      });

      categoryTabs.addEventListener('click', function (e) {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;
        selectedCategory = btn.getAttribute('data-cat');
        Array.from(categoryTabs.querySelectorAll('.tab-btn')).forEach(function (b) {
          b.classList.toggle('active', b === btn);
        });
        renderChannels();
      });

      renderChannels();
    })();
  </script>
